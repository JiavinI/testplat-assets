# 查询账户余额。无入参；成功判定沿用业务 errorCode 字符串 "0"。
# 必填：本接口无 inputs；旧 ${x!} 写法 Engine 0.5 不支持，勿使用。
id: api.gsb.account.balance
name: 查询账户余额
host: gsb
method: POST
url: /api/account/balance
# 4.1a 仍用账号名 gsb。登录流程是 auth/_profiles.yaml 的 gsb_login，凭据由 Web 维护。
auth: gsb
request:
  type: json
  inputs: {}
  body: {}
success:
  path: $.errorCode
  value: "0"
