id: api.gsb.b2.order.intellect_express_items
name: 查询任意 items 智能快递
desc: B2 买家按一组已解析商品/SKU、数量和收件地区查询整单可用快递方案；product_infos 保持调用方顺序，成功响应供订单 flow 按 express_code 选择唯一方案。
host: gsb
method: POST
url: /api/b2/orders/intellect/express
success:
  path: $.errorCode
  value: "0"
request:
  template: structured
  type: json
  inputs:
    receiver:
      type: object
      required: false
      description: 收件人语义对象
    product_infos:
      type: array
      required: true
      description: 已解析商品/SKU 列表
    source_channel:
      type: string
      required: false
      description: 来源渠道
      default: TAOBAO
  body:
    sourceChannel: "${source_channel|TAOBAO}"
    provinceId: "${receiver.province_id}"
    cityId: "${receiver.city_id}"
    districtId: "${receiver.county_id}"
    productInfos: "${product_infos!}"
